<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Utmatic PDF Processor</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://unpkg.com/pdfjs-dist@4.2.67/web/pdf_viewer.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      background: #1c232b;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 0;
      padding: 2.5em 0;
      background: #1c232b;
    }
    .form-container {
      width: 100%;
      max-width: 740px;
      background: #222a33;
      border-radius: 12px;
      box-shadow: 0 8px 32px #0012;
      /* box-shadow: 0 2px 16px 0 rgba(54,83,248,0.07), 0 0.5px 1.5px rgba(0,0,0,0.06); */
      padding: 2.6em 2.4em 2.1em 2.4em;
      margin: 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: min-height 0.18s, height 0.18s;
    }
    .form-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.1em;
      margin-top: 0;
    }
    .form-header-logo svg {
      width: 40px;
      height: 40px;
      margin-bottom: 0.9em;
      display: block;
    }
    .form-header-title {
      font-size: 1.45em;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      text-align: center;
      margin-top: 0;
      margin-bottom: 0;
      line-height: 1.15;
      font-family: 'Work Sans', Arial, sans-serif;
    }
    /* Responsive: shrink padding on mobile */
    @media (max-width: 560px) {
      .form-container {
        padding: 1.7em 0.7em 1.3em 0.7em;
      }
      .form-header-logo svg {
        width: 40px;
        height: 40px;
      }
      .form-header-title {
        font-size: 1.1em;
      }
    }
    /* Hide original header-container and header-text */
    .header-container, .header-text {
      display: none !important;
    }
    /* Blocked message styling */
    #blocked-msg {
      position: fixed;
      top: 0; left: 0; width: 100vw;
      background: #fff7f7;
      color: #c00;
      z-index: 10000;
      padding: 18px;
      font-weight: bold;
      text-align: center;
    }
  </style>
  <!-- Firebase SDKs: MUST be before main.js -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script>
    // --- Firebase config (replace with your real config if needed) ---
    const firebaseConfig = {
      apiKey: "AIzaSyC2Z6UcvqkwBPYzoFMhxc7JFeJHeeNpr3U",
      authDomain: "utmatic.firebaseapp.com",
      projectId: "utmatic",
      storageBucket: "utmatic.firebasestorage.app",
      messagingSenderId: "106080752806",
      appId: "1:106080752806:web:217a463a446a850cf71067",
      measurementId: "G-7JD0EVYF7M"
    };
    firebase.initializeApp(firebaseConfig);

    // Auth gating: block form if not signed in (all plans allowed)
    function getRedirectUrl() {
      // Always redirect back to this page after login
      return window.location.pathname;
    }
    function blockForm(msg) {
      if (!document.getElementById("blocked-msg")) {
        const formBlockedMsg = document.createElement('div');
        formBlockedMsg.id = "blocked-msg";
        formBlockedMsg.innerHTML = msg;
        document.body.appendChild(formBlockedMsg);
      }
      // Hide the main form wrapper
      const mainForm = document.getElementById('main-form-wrapper');
      if (mainForm) mainForm.style.display = 'none';
    }
    async function ensureLoggedIn() {
      await new Promise(resolve => firebase.auth().onAuthStateChanged(resolve));
      const user = firebase.auth().currentUser;
      if (!user) {
        window.location.href = "/auth.html?redirect=" + encodeURIComponent(getRedirectUrl());
        return;
      }
      // If we made it here, user is signed in. Show form if it was hidden.
      const mainForm = document.getElementById('main-form-wrapper');
      if (mainForm) mainForm.style.display = '';
      const blocked = document.getElementById("blocked-msg");
      if (blocked) blocked.remove();
    }
    document.addEventListener('DOMContentLoaded', ensureLoggedIn);
  </script>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    window.addEventListener("load", () => {
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
      }
    });
  </script>

  <div class="page-wrapper" id="main-form-wrapper">
    <div class="main-group">
      <div class="container">
        <div class="form-container">
          <!-- PDF Processor Form Logo and Title -->
          <div class="form-header">
            <span class="form-header-logo" aria-label="Utmatic Logo" style="display:block;">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 69.64 74.34"
                width="40"
                height="40"
                style="display: block;"
              >
                <path fill="#cce1ff" d="M59.6,0H10.04C4.5,0,0,4.5,0,10.04v30.61c0,18.58,15.12,33.7,33.7,33.7h2.25c18.58,0,33.7-15.12,33.7-33.7V10.04c0-5.53-4.5-10.04-10.04-10.04ZM61.91,40.65c0,14.32-11.65,25.97-25.97,25.97h-2.25c-14.32,0-25.97-11.65-25.97-25.97v-16.05h13.33v17.31c0,7.59,6.17,13.76,13.76,13.76s13.76-6.17,13.76-13.76v-17.31h13.33v16.05ZM61.91,16.86h-21.06v25.03c0,3.33-2.71,6.03-6.03,6.03s-6.03-2.71-6.03-6.03v-25.03H7.73v-6.83c0-1.27,1.04-2.31,2.31-2.31h49.56c1.27,0,2.31,1.04,2.31,2.31v6.83Z"/>
              </svg>
            </span>
            <h1 class="form-header-title">PDF Processor</h1>
          </div>
          <div class="tab-bar" id="tab-bar">
            <button aria-label="Add New Document" class="tab" id="add-tab" title="Add New Document">+</button>
          </div>
          <div id="tab-contents"></div>
        </div>
        <div class="file-list">
          <strong>File List</strong>
          <ul id="file-list"></ul>
          <button class="process-btn" disabled="" id="process-btn">Process PDFs</button>
        </div>
      </div>
    </div>
  </div>
  <datalist id="base-url-datalist"></datalist>

  <!-- PDF Previewer Modal Overlay (MODERN) -->
  <div id="pdf-preview-modal-overlay">
    <div id="pdf-preview-container">
      <button id="pdf-previewer-close" onclick="closePdfPreview()" title="Close Previewer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M6 18L18 6"/>
        </svg>
      </button>
      <div id="pdf-previewer-docswitch">
        <span id="previewer-title">Agreement.pdf</span>
        <svg class="caret" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 28 28">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 10l8 8 8-8"/>
        </svg>
        <div id="pdf-previewer-doclist"></div>
      </div>
      <div id="pdf-preview-page-counter">Page 1 / 9</div>
      <div id="pdf-zoom-controls">
        <button id="zoom-out-btn" class="zoom-btn" title="Zoom Out" aria-label="Zoom Out">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="28" height="28">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 12H6"/>
          </svg>
        </button>
        <button id="zoom-in-btn" class="zoom-btn" title="Zoom In" aria-label="Zoom In">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="28" height="28">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6"/>
          </svg>
        </button>
      </div>
      <div id="pdf-preview-inner-container" style="position:relative;">
        <button id="pdf-arrow-prev" class="pdf-arrow-btn" onclick="prevPage()" title="Previous Page">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 28 28">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 22l-8-8 8-8"/>
          </svg>
        </button>
        <div id="pdf-container" style="overflow: auto; max-width: 98vw; max-height: 66vh;">
          <canvas id="pdf-canvas"></canvas>
        </div>
        <button id="pdf-arrow-next" class="pdf-arrow-btn" onclick="nextPage()" title="Next Page">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 28 28">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6l8 8-8 8"/>
          </svg>
        </button>
      </div>
      <div id="pdf-previewer-actions-bar">
        <button id="pdf-previewer-startnew" title="Start New">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
                3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181
                3.182m0-4.991v4.99"/>
          </svg>
          Start new
        </button>
        <button id="download-final-btn" class="primary" title="Download Final PDF">Download</button>
      </div>
    </div>
  </div>

  <!-- Loader/Spinner Overlay -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Processing...</div>
    <div class="loader-subtext">Thanks for your patience! Large documents may take a couple of minutes to process.</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
