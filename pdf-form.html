  <script>
    // --- Firebase config (replace with your real config if needed) ---
    const firebaseConfig = {
      apiKey: "AIzaSyC2Z6UcvqkwBPYzoFMhxc7JFeJHeeNpr3U",
      authDomain: "utmatic.firebaseapp.com",
      projectId: "utmatic",
      storageBucket: "utmatic.firebasestorage.app",
      messagingSenderId: "106080752806",
      appId: "1:106080752806:web:217a463a446a850cf71067",
      measurementId: "G-7JD0EVYF7M"
    };
    firebase.initializeApp(firebaseConfig);

    // Auth gating: block form if not signed in (all plans allowed)
    function getRedirectUrl() {
      // Always redirect back to this page after login
      return window.location.pathname;
    }
    function blockForm(msg) {
      if (!document.getElementById("blocked-msg")) {
        const formBlockedMsg = document.createElement('div');
        formBlockedMsg.id = "blocked-msg";
        formBlockedMsg.innerHTML = msg;
        document.body.appendChild(formBlockedMsg);
      }
      // Hide the main form wrapper
      const mainForm = document.getElementById('main-form-wrapper');
      if (mainForm) mainForm.style.display = 'none';
    }
    async function ensureLoggedIn() {
      await new Promise(resolve => firebase.auth().onAuthStateChanged(resolve));
      const user = firebase.auth().currentUser;
      if (!user) {
        window.location.href = "/auth.html?redirect=" + encodeURIComponent(getRedirectUrl());
        return;
      }
      // If we made it here, user is signed in. Show form if it was hidden.
      const mainForm = document.getElementById('main-form-wrapper');
      if (mainForm) mainForm.style.display = '';
      const blocked = document.getElementById("blocked-msg");
      if (blocked) blocked.remove();
    }
    document.addEventListener('DOMContentLoaded', ensureLoggedIn);
  </script>

  <script src="script.js"></script>
  <script>
      firebase.auth().onAuthStateChanged(function(user) {
        const nameEl = document.getElementById('profile-name');
        if (!nameEl) return;
        if (!user) {
          nameEl.textContent = "";
        } else if (user.displayName) {
          nameEl.textContent = user.displayName;
        } else if (user.email) {
          nameEl.textContent = user.email;
        } else {
          nameEl.textContent = "User";
        }

        // Set profile icon image if available
        const profileIcon = document.getElementById('profile-icon');
        if (profileIcon) {
          if (user && user.photoURL) {
            profileIcon.innerHTML = `<img src="${user.photoURL}" alt="user" style="width:100%;height:100%;border-radius:50%;">`;
          } else {
            profileIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cce1ff"><path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" /></svg>`;
          }
        }
      });

      // Header dropdown logic
      const dropdownBtn = document.getElementById('new-dropdown-btn');
      const dropdownList = document.getElementById('new-dropdown-list');
      if (dropdownBtn && dropdownList) {
        dropdownBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          dropdownList.classList.toggle('show');
        });
        document.addEventListener('click', function(e) {
          if (!dropdownBtn.contains(e.target) && !dropdownList.contains(e.target)) {
            dropdownList.classList.remove('show');
          }
        });
      }

      // Sign out logic
      const signoutBtn = document.getElementById('signout-btn');
      if (signoutBtn) {
        signoutBtn.addEventListener('click', function() {
          firebase.auth().signOut().then(function() {
            window.location.href = "/login";
          });
        });
      }

    // --- LOADING OVERLAY LOGIC (copied from INDD) ---
    function showPageLoadingOverlay() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
        overlay.style.display = 'flex';
      }
    }
    function hidePageLoadingOverlay() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 400);
      }
    }
    // Show overlay as soon as possible, hide after load
    window.addEventListener('DOMContentLoaded', () => {
      showPageLoadingOverlay();
      setTimeout(hidePageLoadingOverlay, 600); // Simulate async setup, adjust as needed
    });
  </script>
