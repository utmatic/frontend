<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utmatic Document Hub</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #f8faff;
      font-family: 'Work Sans', 'Segoe UI', 'Inter', 'Roboto', Arial, sans-serif;
      color: #23272f;
    }
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f8faff;
      padding: 0 1.5rem;
    }
    .logo {
      width: 190px;
      max-width: 70vw;
      margin-bottom: 2.4rem;
      margin-top: 0.5rem;
      display: block;
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.01em;
      margin-bottom: 2.1rem;
      margin-top: 0;
      text-align: center;
    }
    .landing-options {
      display: flex;
      gap: 2.2rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .landing-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 1.1rem 2.2rem;
      font-size: 1.22rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 3px 16px 0 rgba(37,99,235,0.10);
      transition: background 0.17s, transform 0.13s, box-shadow 0.18s;
      margin-bottom: 0.2rem;
    }
    .landing-btn:hover, .landing-btn:focus {
      background: #1a1a1a;
      transform: scale(1.04);
      box-shadow: 0 5px 22px 0 rgba(30,64,175,0.13);
      color: #fff;
      text-decoration: none;
    }
    @media (max-width: 700px) {
      .landing-options {
        flex-direction: column;
        gap: 1.1rem;
      }
      .logo {
        width: 150px;
        margin-bottom: 1.4rem;
      }
      h1 {
        font-size: 1.35rem;
      }
      .landing-btn {
        min-width: 130px;
        font-size: 1.03rem;
        padding: 0.8rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="landing">
    <img src="logo.png" class="logo" alt="Utmatic Logo"/>
    <h1>What would you like to process?</h1>
    <div class="landing-options">
      <a href="pdf-form.html" class="landing-btn">PDFs</a>
      <a href="source-form.html" class="landing-btn">Source Files</a>
    </div>
  </div>
</body>
</html>
