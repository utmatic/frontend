<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign In · Utmatic</title>
  <link rel="stylesheet" href="auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="https://images.squarespace-cdn.com/content/v1/680bb671dac3025d584cb957/18d85426-497a-4e59-a47e-df025211ffee/logo-utmatic-nobackground.png?format=1500w" alt="Utmatic Logo"/>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin" type="button">Sign in</button>
        <button class="auth-tab" id="tab-signup" type="button">Sign up</button>
      </div>

      <form class="auth-form" id="signin-form" autocomplete="on">
        <div class="form-group">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" name="email" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" name="password" autocomplete="current-password" required/>
        </div>
        <div class="form-row align-center">
          <label class="checkbox-label">
            <input type="checkbox" name="remember"/>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="auth-btn">Sign in</button>
        <div class="auth-or"><span>or</span></div>
        <button type="button" class="auth-btn auth-btn-google"><img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo_2013_Google.png" alt="" class="google-icon"/> Sign in with Google</button>
      </form>

      <form class="auth-form" id="signup-form" style="display:none;" autocomplete="on">
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <label for="signup-company">Company or Organization</label>
          <input type="text" id="signup-company" name="company" autocomplete="organization" required/>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="8"/>
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm password</label>
          <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" required minlength="8"/>
        </div>
        <div class="form-row">
          <label class="checkbox-label checkbox-agree">
            <input type="checkbox" name="tos" required/>
            <span>
              I agree to the
              <a href="#" target="_blank">Terms</a>
              and
              <a href="#" target="_blank">Privacy Policy</a>
            </span>
          </label>
        </div>
        <button type="submit" class="auth-btn">Sign up</button>
        <div class="auth-or"><span>or</span></div>
        <button type="button" class="auth-btn auth-btn-google"><img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo_2013_Google.png" alt="" class="google-icon"/> Sign up with Google</button>
      </form>

      <div class="auth-footer">
        <span id="footer-signin">New to Utmatic? <a href="#" id="footer-signup-link">Sign up</a></span>
        <span id="footer-signup" style="display:none;">Already have an account? <a href="#" id="footer-signin-link">Sign in</a></span>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
