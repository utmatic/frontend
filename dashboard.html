<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Utmatic Dash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Work+Sans:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dash.css" />
  <style>
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      min-height: 72px;
      max-height: 72px;
      padding: 0 36px;
      background: var(--background-main, #1c232b);
      box-sizing: border-box;
    }
    .profile-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: var(--background-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .profile-icon svg {
      width: 32px !important;
      height: 32px !important;
      display: block;
      fill: #cce1ff !important;
    }
    .profile-name {
      color: #fff;
      font-weight: 500;
      font-size: 1.03rem;
      max-width: 140px;
      word-break: break-word;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* --- Timesave Counter Styles --- */
    .timesave-widget {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      background: #222a33;
      border-radius: 12px;
      margin: 5px 0 24px 0;
      padding: 28px 36px 24px 36px;
      min-width: 260px;
      max-width: 100%;
      box-shadow: none;
    }
    .timesave-label {
      font-size: 1.12rem;
      font-weight: 500;
      color: #cce1ff;
      margin-bottom: 10px;
    }
    .timesave-main {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .timesave-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      min-width: 90px;
    }
    .timesave-unit-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
    }
    .timesave-unit-btn {
      background: none;
      border: none;
      color: #cce1ff;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.18s;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .timesave-unit-btn.active,
    .timesave-unit-btn:hover {
      background: none;
      opacity: 1;
    }
    @media (max-width: 600px) {
      .timesave-widget {
        padding: 18px 12px 18px 12px;
        margin: 20px 0 10px 0;
      }
      .timesave-value {
        font-size: 1.5rem;
        min-width: 56px;
      }
    }

    /* --- PATCH: Presets List Styles --- */
    .presets-list {
      width: 100%;
      max-width: 900px;
      margin: 25px 0px;
      border-radius: 12px;
      background: none;
      box-shadow: 0 6px 32px rgba(0,0,0,0.11);
    }
    .preset-list-row {
      display: flex;
      align-items: center;
      min-height: 46px;
      cursor: pointer;
      background: #232a33;
      border-bottom: 1px solid #29313a;
      transition: background 0.13s;
      padding: 40px 24px;
      user-select: none;
    }
    .preset-list-row:hover, .preset-list-row.active {
      background: #232c39;
    }
    .preset-list-name {
      font-weight: 600;
      color: #e5edfa;
      font-size: 1.08em;
      letter-spacing: 0.01em;
      flex: 1;
      margin: 12px;
      padding: 0;
      line-height: 1.4;
    }
    .preset-list-actions {
      margin-left: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .preset-list-details {
      display: none;
      background: #253043;
      padding: 0px 32px;
      font-size: 1.01em;
      border-bottom: none;
      animation: fadein 0.13s;
    }
    .preset-list-details.show {
      display: block;
    }
    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .add-preset-btn {
      margin: 24px 0 0 24px;
      background: var(--brand-blue, #4d89f9);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 26px;
      font-size: 1.07rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
      box-shadow: 0 2px 8px 0 rgba(44, 63, 114, 0.09);
      display: block;
      outline: none;
      width: auto;
    }
    .add-preset-btn:hover,
    .add-preset-btn:focus {
      background: var(--brand-blue-hover, #3474e0);
      color: #fff;
    }
  </style>

  <script>
    // Show user's name/email in profile area after login
    document.addEventListener('DOMContentLoaded', function() {
      firebase.auth().onAuthStateChanged(function(user) {
        const nameEl = document.getElementById('profile-name');
        if (!nameEl) return;
        if (!user) {
          nameEl.textContent = "";
        } else if (user.displayName) {
          nameEl.textContent = user.displayName;
        } else if (user.email) {
          nameEl.textContent = user.email;
        } else {
          nameEl.textContent = "User";
        }

        // Set profile icon image if available
        const profileIcon = document.getElementById('profile-icon');
        if (profileIcon) {
          if (user && user.photoURL) {
            profileIcon.innerHTML = `<img src="${user.photoURL}" alt="user" style="width:100%;height:100%;border-radius:50%;">`;
          } else {
            profileIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cce1ff"><path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" /></svg>`;
          }
        }
      });
    });

    // PATCH: Preset details show/hide logic
    function toggleDetails(row) {
      // Optionally: close all details except the clicked one
      document.querySelectorAll('.preset-list-row').forEach(r => r.classList.remove('active'));
      document.querySelectorAll('.preset-list-details').forEach(d => d.classList.remove('show'));

      row.classList.toggle('active');
      const details = row.nextElementSibling;
      if (details && details.classList.contains('preset-list-details')) {
        details.classList.toggle('show');
        // Optionally: keep row active only if details are open
        if (!details.classList.contains('show')) row.classList.remove('active');
      }
    }
  </script>
