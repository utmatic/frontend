<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Utmatic Dash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Work+Sans:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dash.css" />
  <style>
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      min-height: 72px;
      max-height: 72px;
      padding: 0 36px;
      background: var(--background-main, #1c232b);
      box-sizing: border-box;
    }
    .profile-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: var(--background-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .profile-icon svg {
      width: 32px !important;
      height: 32px !important;
      display: block;
      fill: #cce1ff !important;
    }
    .profile-name {
      color: #fff;
      font-weight: 500;
      font-size: 1.03rem;
      max-width: 140px;
      word-break: break-word;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* --- Timesave Counter Styles --- */
    .timesave-widget {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      background: #222a33;
      border-radius: 12px;
      margin: 5px 0 24px 0;
      padding: 28px 36px 24px 36px;
      min-width: 260px;
      max-width: 100%;
      box-shadow: none;
    }
    .timesave-label {
      font-size: 1.12rem;
      font-weight: 500;
      color: #cce1ff;
      margin-bottom: 10px;
    }
    .timesave-main {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .timesave-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      min-width: 90px;
    }
    .timesave-unit-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
    }
    .timesave-unit-btn {
      background: none;
      border: none;
      color: #cce1ff;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.18s;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .timesave-unit-btn.active,
    .timesave-unit-btn:hover {
      background: none;
      opacity: 1;
    }
    @media (max-width: 600px) {
      .timesave-widget {
        padding: 18px 12px 18px 12px;
        margin: 20px 0 10px 0;
      }
      .timesave-value {
        font-size: 1.5rem;
        min-width: 56px;
      }
    }

    /* --- PATCH: Presets List Styles --- */
    .presets-list {
      width: 100%;
      max-width: 900px;
      margin: 25px 0px;
      border-radius: 12px;
      background: none;
      box-shadow: 0 6px 32px rgba(0,0,0,0.11);
    }
    .preset-list-row {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      background: #232a33;
      border-bottom: 1px solid #29313a;
      transition: background 0.13s;
      user-select: none;
      padding: 0;
    }
    .preset-list-row:hover, .preset-list-row.active {
      background: #232c39;
    }
    .preset-list-header {
      display: flex;
      align-items: center;
      min-height: 46px;
      padding: 16px 24px;
      width: 100%;
      box-sizing: border-box;
    }
    .preset-list-name {
      font-weight: 600;
      color: #e5edfa;
      font-size: 1.08em;
      letter-spacing: 0.01em;
      flex: 1;
      margin: 0;
      padding: 0;
      line-height: 1.4;
    }
    .preset-list-actions {
      margin-left: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .preset-list-details {
      display: none;
      background: #253043;
      padding: 18px 32px;
      font-size: 1.01em;
      border-top: 1px solid #2c3540;
      border-bottom: 1px solid #29313a;
      animation: fadein 0.13s;
    }
    .preset-list-row.active .preset-list-details {
      display: block;
    }
    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .add-preset-btn {
      margin: 24px 0 0 24px;
      background: var(--brand-blue, #4d89f9);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 26px;
      font-size: 1.07rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
      box-shadow: 0 2px 8px 0 rgba(44, 63, 114, 0.09);
      display: block;
      outline: none;
      width: auto;
    }
    .add-preset-btn:hover,
    .add-preset-btn:focus {
      background: var(--brand-blue-hover, #3474e0);
      color: #fff;
    }
  </style>
  <!-- Firebase SDKs (must be loaded before dash.js) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- Loading Overlay: Pulsing logo icon on #1c232b background -->
  <div id="loading-overlay">
    <div class="loader-logo">
      <svg id="utmatic-loader-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115.33 123.12" aria-hidden="true">
        <path class="logo-path" d="M98.7,0H16.62C7.46,0,0,7.46,0,16.62v50.69c0,30.77,25.03,55.8,55.8,55.8h3.72c30.77,0,55.8-25.03,55.8-55.8V16.62c0-9.17-7.46-16.62-16.62-16.62ZM102.53,67.31c0,23.71-19.29,43-43,43h-3.72c-23.71,0-43-19.29-43-43v-26.59h22.07v28.66c0,12.57,10.22,22.79,22.79,22.79s22.79-10.22,22.79-22.79v-28.66h22.07v26.59ZM102.53,27.93h-34.87v41.46c0,5.51-4.48,9.99-9.99,9.99s-9.99-4.48-9.99-9.99V27.93H12.8v-11.3c0-2.11,1.72-3.82,3.82-3.82h82.08c2.11,0,3.82,1.72,3.82,3.82v11.3Z"/>
      </svg>
    </div>
  </div>
  <div class="dash-root">
    <nav class="dash-sidebar expanded">
      <div class="dash-logo-container">
        <div class="dash-logo">
          <!-- Inline SVG logo (Utmatic) -->
          <!-- ... (logo markup unchanged for brevity) ... -->
        </div>
      </div>
      <!-- Sidebar buttons unchanged -->
      <button data-view="dashboard" class="dash-sidebar-btn active">
        <!-- ... -->
        <span class="btn-label">Dashboard</span>
      </button>
      <button data-view="history" class="dash-sidebar-btn">
        <!-- ... -->
        <span class="btn-label">History</span>
      </button>
      <button data-view="presets" class="dash-sidebar-btn">
        <!-- ... -->
        <span class="btn-label">Presets</span>
      </button>
    </nav>
    <div class="dash-main-content">
      <header class="dash-header">
        <!-- ... header unchanged ... -->
      </header>
      <main id="dash-main-view">
        <section class="presets-section">
          <div class="presets-list">
            <!-- Example preset rows: -->
            <div class="preset-list-row" onclick="toggleDetails(this)">
              <div class="preset-list-header">
                <span class="preset-list-name">Sample Preset 1</span>
                <div class="preset-list-actions">
                  <button title="Edit" style="background:none;border:none;color:#b3b9c5;">✏️</button>
                  <button title="Delete" style="background:none;border:none;color:#b3b9c5;">🗑️</button>
                </div>
              </div>
              <div class="preset-list-details">
                <strong>Details for Sample Preset 1:</strong><br>
                More information about preset 1 goes here.
              </div>
            </div>
            <div class="preset-list-row" onclick="toggleDetails(this)">
              <div class="preset-list-header">
                <span class="preset-list-name">Sample Preset 2</span>
                <div class="preset-list-actions">
                  <button title="Edit" style="background:none;border:none;color:#b3b9c5;">✏️</button>
                  <button title="Delete" style="background:none;border:none;color:#b3b9c5;">🗑️</button>
                </div>
              </div>
              <div class="preset-list-details">
                <strong>Details for Sample Preset 2:</strong><br>
                More information about preset 2 goes here.
              </div>
            </div>
            <!-- Add new preset button -->
            <button class="add-preset-btn">+ Add Preset</button>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="dash.js"></script>
  <script>
    // Show user's name/email in profile area after login
    document.addEventListener('DOMContentLoaded', function() {
      firebase.auth().onAuthStateChanged(function(user) {
        const nameEl = document.getElementById('profile-name');
        if (!nameEl) return;
        if (!user) {
          nameEl.textContent = "";
        } else if (user.displayName) {
          nameEl.textContent = user.displayName;
        } else if (user.email) {
          nameEl.textContent = user.email;
        } else {
          nameEl.textContent = "User";
        }
        // Set profile icon image if available
        const profileIcon = document.getElementById('profile-icon');
        if (profileIcon) {
          if (user && user.photoURL) {
            profileIcon.innerHTML = `<img src="${user.photoURL}" alt="user" style="width:100%;height:100%;border-radius:50%;">`;
          } else {
            profileIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cce1ff"><path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" /></svg>`;
          }
        }
      });
    });

    // PATCH: Preset details show/hide logic
    function toggleDetails(row) {
      // Optionally: close all details except the clicked one
      document.querySelectorAll('.preset-list-row').forEach(r => r.classList.remove('active'));
      row.classList.toggle('active');
    }
  </script>
</body>
</html>
