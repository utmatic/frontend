<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Utmatic Dash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Work+Sans:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dash.css" />
  <style>
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      min-height: 72px;
      max-height: 72px;
      padding: 0 36px;
      background: var(--background-main, #1c232b);
      box-sizing: border-box;
    }
    .profile-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: var(--background-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .profile-icon svg {
      width: 32px !important;
      height: 32px !important;
      display: block;
      fill: #cce1ff !important;
    }
    .profile-name {
      color: #fff;
      font-weight: 500;
      font-size: 1.03rem;
      max-width: 140px;
      word-break: break-word;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
  <!-- Firebase SDKs (must be loaded before dash.js) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="dash-root">
    <nav class="dash-sidebar expanded">
      <div class="dash-logo-container">
        <div class="dash-logo">
          <!-- Inline SVG logo (Utmatic) -->
          <!-- ... SVG code unchanged ... -->
          <?xml version="1.0" encoding="UTF-8"?>
          <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 129.99"> ... </svg>
        </div>
      </div>
      <button data-view="dashboard" class="dash-sidebar-btn active">
        <span class="btn-icon">
          <!-- Dashboard Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="22" height="22">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
          </svg>
        </span>
        <span class="btn-label">Dashboard</span>
      </button>
      <button data-view="history" class="dash-sidebar-btn">
        <span class="btn-icon">
          <!-- History Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="22" height="22">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </span>
        <span class="btn-label">History</span>
      </button>
      <button data-view="settings" class="dash-sidebar-btn">
        <span class="btn-icon">
          <!-- Settings Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="22" height="22">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </span>
        <span class="btn-label">Settings</span>
      </button>
    </nav>
    <div class="dash-main-content">
      <header class="dash-header">
        <div class="header-actions">
          <div class="new-dropdown">
            <button class="new-dropdown-btn" id="new-dropdown-btn" title="New">
              <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="#cce1ff" fill="none"/>
                <path d="M12 8v8M8 12h8" stroke="#cce1ff" stroke-linecap="round"/>
              </svg>
              <span class="new-dropdown-label">New</span>
            </button>
            <div class="new-dropdown-list" id="new-dropdown-list">
              <a href="https://app.utmatic.com/pdf-form.html" target="_blank" rel="noopener" class="dropdown-item">PDF Processor</a>
              <a href="https://app.utmatic.com/source-form.html" target="_blank" rel="noopener" class="dropdown-item">Indd Processor</a>
            </div>
          </div>
        </div>
        <div class="profile-area">
          <span class="profile-name" id="profile-name"></span>
          <span class="profile-icon" id="profile-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cce1ff">
              <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
            </svg>
          </span>
          <button class="signout-btn" id="signout-btn" title="Sign out">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cce1ff" stroke-width="2">
              <path d="M16 17l5-5-5-5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 19a7 7 0 1 1 0-14" />
            </svg>
            <span class="signout-label">Sign out</span>
          </button>
        </div>
      </header>
      <main id="dash-main-view">
        <!-- Main content injected by JS -->
      </main>
    </div>
  </div>
  <script src="dash.js"></script>
  <script>
    // Show user's name/email in profile area after login
    document.addEventListener('DOMContentLoaded', function() {
      firebase.auth().onAuthStateChanged(function(user) {
        const nameEl = document.getElementById('profile-name');
        if (!nameEl) return;
        if (!user) {
          nameEl.textContent = "";
        } else if (user.displayName) {
          nameEl.textContent = user.displayName;
        } else if (user.email) {
          nameEl.textContent = user.email;
        } else {
          nameEl.textContent = "User";
        }

        // Set profile icon image if available
        const profileIcon = document.getElementById('profile-icon');
        if (profileIcon) {
          if (user && user.photoURL) {
            profileIcon.innerHTML = `<img src="${user.photoURL}" alt="user" style="width:100%;height:100%;border-radius:50%;">`;
          } else {
            profileIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cce1ff"><path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" /></svg>`;
          }
        }
      });
    });
  </script>
</body>
</html>
