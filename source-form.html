<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>InDesign Processor</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <!-- Firebase SDKs: MUST be before src-script.js -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    // --- Firebase config (replace with your real config if needed) ---
    const firebaseConfig = {
      apiKey: "AIzaSyC2Z6UcvqkwBPYzoFMhxc7JFeJHeeNpr3U",
      authDomain: "utmatic.firebaseapp.com",
      projectId: "utmatic",
      storageBucket: "utmatic.firebasestorage.app",
      messagingSenderId: "106080752806",
      appId: "1:106080752806:web:217a463a446a850cf71067",
      measurementId: "G-7JD0EVYF7M"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <style>
    html, body {
      height: 100%;
      min-height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .page-wrapper {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }
    .site-footer {
      background: none;
      color: #7a859780;
      text-align: center;
      padding: 2em 0;
      font-size: 0.97em;
      position: relative;
      z-index: 20;
      letter-spacing: 0.01em;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- DASHBOARD HEADER (injected above content) -->
  <div class="dash-header" style="margin-bottom:32px;">
    <div class="header-actions">
      <div class="new-dropdown">
        <button class="new-dropdown-btn" id="new-dropdown-btn" title="New">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="#cce1ff" fill="none"/>
            <path d="M12 8v8M8 12h8" stroke="#cce1ff" stroke-linecap="round"/>
          </svg>
          <span class="new-dropdown-label">New</span>
        </button>
        <div class="new-dropdown-list" id="new-dropdown-list">
          <a href="https://app.utmatic.com/pdf-form" target="_blank" rel="noopener" class="dropdown-item">PDF Processor</a>
          <a href="https://app.utmatic.com/indd-form" target="_blank" rel="noopener" class="dropdown-item">Indd Processor</a>
        </div>
      </div>
    </div>
    <!-- Center: Dashboard link SVG button only -->
    <div class="header-center">
      <a href="https://app.utmatic.com/dashboard" class="dashboard-icon-btn" title="Go to Dashboard" style="display:flex;align-items:center;justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:34px;height:34px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
        </svg>
      </a>
    </div>
    <div class="profile-area">
      <span class="profile-name" id="profile-name"></span>
      <span class="profile-icon" id="profile-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cce1ff">
          <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
        </svg>
      </span>
      <button class="signout-btn" id="signout-btn" title="Sign out">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cce1ff" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
        </svg>
        <span class="signout-label">Sign out</span>
      </button>
    </div>
  </div>

  <!-- Loading Overlay: Pulsing logo icon on #1c232b background -->
  <div id="loading-overlay">
    <div class="loader-logo">
      <svg id="utmatic-loader-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115.33 123.12" aria-hidden="true">
        <path class="logo-path" d="M98.7,0H16.62C7.46,0,0,7.46,0,16.62v50.69c0,30.77,25.03,55.8,55.8,55.8h3.72c30.77,0,55.8-25.03,55.8-55.8V16.62c0-9.17-7.46-16.62-16.62-16.62ZM102.53,67.31c0,23.71-19.29,43-43,43h-3.72c-23.71,0-43-19.29-43-43v-26.59h22.07v28.66c0,12.57,10.22,22.79,22.79,22.79s22.79-10.22,22.79-22.79v-28.66h22.07v26.59ZM102.53,27.93h-34.87v41.46c0,5.51-4.48,9.99-9.99,9.99s-9.99-4.48-9.99-9.99V27.93H12.8v-11.3c0-2.11,1.72-3.82,3.82-3.82h82.08c2.11,0,3.82,1.72,3.82,3.82v11.3Z"/>
      </svg>
    </div>
  </div>

  <div class="page-wrapper" id="main-form-wrapper">
    <div class="main-group">
      <div class="container">
        <div class="form-container">
          <form id="iddForm" enctype="multipart/form-data" autocomplete="off">
            <!-- Form Logo and Title -->
            <div class="form-header">
              <span class="form-header-logo" aria-label="Utmatic Logo" style="display:block;">
              <!-- Inline SVG logo, sized to roughly 40x40px and centered like original -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 69.64 74.34"
                width="40"
                height="60"
                style="display: block;"
              >
                <path fill="#cce1ff" d="M59.6,0H10.04C4.5,0,0,4.5,0,10.04v30.61c0,18.58,15.12,33.7,33.7,33.7h2.25c18.58,0,33.7-15.12,33.7-33.7V10.04c0-5.53-4.5-10.04-10.04-10.04ZM61.91,40.65c0,14.32-11.65,25.97-25.97,25.97h-2.25c-14.32,0-25.97-11.65-25.97-25.97v-16.05h13.33v17.31c0,7.59,6.17,13.76,13.76,13.76s13.76-6.17,13.76-13.76v-17.31h13.33v16.05ZM61.91,16.86h-21.06v25.03c0,3.33-2.71,6.03-6.03,6.03s-6.03-2.71-6.03-6.03v-25.03H7.73v-6.83c0-1.27,1.04-2.31,2.31-2.31h49.56c1.27,0,2.31,1.04,2.31,2.31v6.83Z"/>
              </svg>
              </span>
              <h1 class="form-header-title">InDesign Processor</h1>
            </div>
            <div class="field-group">
              <label for="file">Upload File</label>
              <div class="custom-file-input-wrapper">
                <label class="custom-file-input-label" tabindex="0">
                  Choose File
                  <input type="file" name="file" id="file" accept=".indd" class="custom-file-input" required>
                </label>
                <span class="custom-file-filename" id="file-filename">No file chosen</span>
              </div>
            </div>
            <div class="field-group">
              <label for="job_type">Job Type</label>
              <select name="job_type" id="job_type" required>
                <option value="" disabled selected>Select one</option>
                <option value="add_utm">Add UTM only</option>
                <option value="add_links_only">Add links only</option>
                <option value="add_links_with_utm">Add links with UTM</option>
              </select>
            </div>
            <!-- Presets dropdown: conditionally displayed via JS -->
            <div class="field-group" id="presets-dropdown-group" style="display: none;">
              <label for="preset_select">Presets</label>
              <select id="preset_select" name="preset_select">
                <option value="" selected>Select a preset</option>
                <!-- JS populates user's presets here -->
              </select>
            </div>
            <div id="link-fields" class="field-row-wrapper" style="display:none;">
              <button type="button" class="add-new-row-btn" id="add-row-btn">+ Add new</button>
              <div id="target-base-rows"></div>
            </div>
            <!-- UTM section is now fully wrapped -->
            <div id="utm-section">
              <span class="utm-label" id="utm-label">UTM Parameters</span>
              <div class="utm-row" id="utm-row">
                <div class="field-group">
                  <input type="text" name="utm_source" id="utm_source" placeholder="Source" required>
                </div>
                <div class="field-group">
                  <input type="text" name="utm_medium" id="utm_medium" placeholder="Medium" required>
                </div>
                <div class="field-group">
                  <input type="text" name="utm_campaign" id="utm_campaign" placeholder="Campaign" required>
                </div>
                <div class="field-group">
                  <input type="text" name="utm_content" id="utm_content" placeholder="Content (automatic)" readonly>
                </div>
              </div>
            </div>
            <!-- Document Name field REMOVED -->
            <div class="form-actions">
              <button type="submit" id="submitBtn" class="process-btn" disabled>Process</button>
            </div>
          </form>
          <div id="status"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Processing your file...</div>
    <div class="loader-subtext">Thanks for your patience! Large documents may take a couple of minutes to process.</div>
  </div>
  <div id="result-screen">
    <div class="result-content">
      <div class="result-heading">
        <div class="result-title-text">Your processed files are ready!</div>
      </div>
      <div class="result-btns" id="result-btns"></div>
      <!-- Return to submission button, matching style to report-link and startnew-link -->
      <a href="#" class="result-return-link" id="result-return-link">
        <span>Return to your submission</span>
      </a>
      <a href="https://app.utmatic.com/indd-form" class="startnew-link" id="start-new-link">
        <span>Start new submission</span>
      </a>
    </div>
  </div>
  <!-- Your main JS last -->
  <script src="src-script.js"></script>
  <script>
    // Show user's name/email in profile area after login
    document.addEventListener('DOMContentLoaded', function() {
      firebase.auth().onAuthStateChanged(function(user) {
        const nameEl = document.getElementById('profile-name');
        if (!nameEl) return;
        if (!user) {
          nameEl.textContent = "";
        } else if (user.displayName) {
          nameEl.textContent = user.displayName;
        } else if (user.email) {
          nameEl.textContent = user.email;
        } else {
          nameEl.textContent = "User";
        }

        // Set profile icon image if available
        const profileIcon = document.getElementById('profile-icon');
        if (profileIcon) {
          if (user && user.photoURL) {
            profileIcon.innerHTML = `<img src="${user.photoURL}" alt="user" style="width:100%;height:100%;border-radius:50%;">`;
          } else {
            profileIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cce1ff"><path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" /></svg>`;
          }
        }
      });

      // Header dropdown logic
      const dropdownBtn = document.getElementById('new-dropdown-btn');
      const dropdownList = document.getElementById('new-dropdown-list');
      if (dropdownBtn && dropdownList) {
        dropdownBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          dropdownList.classList.toggle('show');
        });
        document.addEventListener('click', function(e) {
          if (!dropdownBtn.contains(e.target) && !dropdownList.contains(e.target)) {
            dropdownList.classList.remove('show');
          }
        });
      }

      // Sign out logic
      const signoutBtn = document.getElementById('signout-btn');
      if (signoutBtn) {
        signoutBtn.addEventListener('click', function() {
          firebase.auth().signOut().then(function() {
            window.location.href = "/login";
          });
        });
      }
    });
  </script>

  <footer class="site-footer">
  © 2025 Utmatic
</footer>
  
</body>
</html>
