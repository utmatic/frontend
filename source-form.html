<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Utmatic Source File Processor</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .field-row-wrapper {
      margin-bottom: 1em;
    }
    .side-by-side-fields {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 0.5em;
    }
    .side-by-side-fields .field-group {
      flex: 1 1 200px;
      min-width: 200px;
    }
    .field-row {
      display: flex;
      gap: 16px;
      margin-bottom: 0.5em;
      align-items: center;
    }
    .delete-row-btn {
      background: none;
      border: none;
      color: #f43f5e;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0 0.25em;
      line-height: 1;
      transition: color 0.15s;
    }
    .delete-row-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .add-new-row-btn {
      background: #3653f8;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.38em 1.3em;
      margin-left: 0;
      margin-bottom: 0.18em;
      margin-top: 0;
      display: block;
      font-size: 1em;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.16s;
    }
    .add-new-row-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    @media (max-width: 700px) {
      .side-by-side-fields, .field-row {
        flex-direction: column;
        gap: 0;
      }
    }
    /* Loader overlay */
    #loader {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.84);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.2s;
    }
    #loader.active {
      display: flex;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 7px solid #e4e7ef;
      border-top: 7px solid #3653f8;
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
      margin-bottom: 1em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      font-weight: 600;
      font-size: 1.2em;
      margin-bottom: 0.25em;
      color: #222;
      text-align: center;
    }
    .loader-subtext {
      color: #666;
      font-size: 1em;
      text-align: center;
    }
    /* Download and new submission screen */
    #result-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 330px;
      margin-top: 4em;
    }
    #result-screen .result-heading {
      font-size: 1.25em;
      font-weight: 600;
      margin-bottom: 1.4em;
      color: #222;
      text-align: center;
    }
    #result-screen .result-btns {
      display: flex;
      flex-direction: row;
      gap: 1.5em;
      margin-bottom: 1.3em;
      flex-wrap: wrap;
      justify-content: center;
    }
    #result-screen .process-btn, #result-screen .startnew-btn {
      background: #3653f8;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.62em 2.2em;
      font-size: 1em;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      margin-top: 0.25em;
      transition: background 0.16s;
      box-shadow: 0 2px 9px 0 rgba(54,83,248,0.07);
    }
    #result-screen .process-btn:hover, #result-screen .startnew-btn:hover {
      background: #2537b8;
    }
  </style>
</head>
<body>
  <div class="page-wrapper" id="main-form-wrapper">
    <div class="main-group">
      <div class="header-container">
        <img alt="Utmatic Logo" class="logo" src="https://static1.squarespace.com/static/680bb671dac3025d584cb957/t/6821ece9779432159d432868/1747053801328/logo-utmatic-nobackground.png"/>
        <div class="header-text">
          <p>Process your InDesign source files with automatic hyperlinking and UTM tracking.</p>
        </div>
      </div>
      <div class="container">
        <div class="form-container">
          <form id="iddForm" enctype="multipart/form-data" autocomplete="off">
            <div class="field-group">
              <label for="file">Upload InDesign File (.indd):</label>
              <div class="custom-file-input-wrapper">
                <label class="custom-file-input-label" tabindex="0">
                  Choose File
                  <input type="file" name="file" id="file" accept=".indd" class="custom-file-input" required>
                </label>
                <span class="custom-file-filename" id="file-filename">No file chosen</span>
              </div>
            </div>
            <!-- Job Type Field -->
            <div class="field-group">
              <label for="job_type">Job Type:</label>
              <select name="job_type" id="job_type" required>
                <option value="add_utm">Add UTM</option>
                <option value="add_links_only">Add links only</option>
                <option value="add_links_with_utm">Add links with UTM</option>
              </select>
            </div>
            <!-- Target Format & Base URL dynamic rows -->
            <div id="link-fields" class="field-row-wrapper" style="display:none;">
              <div id="target-base-rows"></div>
              <button type="button" class="add-new-row-btn" id="add-row-btn">+ Add new</button>
            </div>
            <span class="utm-label" id="utm-label">UTM Parameters</span>
            <div class="utm-row" id="utm-row">
              <div class="field-group">
                <input type="text" name="utm_source" id="utm_source" placeholder="Source" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_medium" id="utm_medium" placeholder="Medium" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_campaign" id="utm_campaign" placeholder="Campaign" required>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" id="submitBtn" class="process-btn">Process Source File</button>
            </div>
          </form>
          <div id="status"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- Loader/Spinner Overlay -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Processing your file...</div>
    <div class="loader-subtext">Thanks for your patience! Large documents may take a couple of minutes to process.</div>
  </div>
  <!-- Result/Download Screen -->
  <div id="result-screen">
    <div class="result-heading">Your processed files are ready!</div>
    <div class="result-btns" id="result-btns"></div>
    <button class="startnew-btn" id="start-new-btn">Start new submission</button>
  </div>
  <script src="src-script.js"></script>
</body>
</html>
