
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Utmatic Source File Processor</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="page-wrapper" id="main-form-wrapper">
    <div class="main-group">
      <div class="header-container">
        <img alt="Utmatic Logo" class="logo" src="https://static1.squarespace.com/static/680bb671dac3025d584cb957/t/6821ece9779432159d432868/1747053801328/logo-utmatic-nobackground.png"/>
        <div class="header-text">
          <p>Process your InDesign source files with automatic hyperlinking and UTM tracking.</p>
        </div>
      </div>
      <div class="container">
        <div class="form-container">
          <form id="iddForm" enctype="multipart/form-data" autocomplete="off">
            <div class="field-group">
              <label for="file">Upload InDesign or PDF File:</label>
              <input type="file" name="file" id="file" accept=".indd,.pdf" required>
            </div>
            <div class="field-group">
              <label for="job_type">Job Type</label>
              <select name="job_type" id="job_type" required>
                <option value="">Select one</option>
                <option value="links_and_utm">Add Links and UTM</option>
                <option value="utm_only">Add UTM Only</option>
              </select>
            </div>
            <div class="checkbox-wrapper hidden" id="utm-toggle-row">
              <input type="checkbox" id="disable_utm" name="disable_utm">
              <label for="disable_utm">Add links only (no UTM parameters)</label>
            </div>
            <div class="field-group">
              <label for="target_format">Target Format(s)</label>
              <input type="text" name="target_format" id="target_format" placeholder="e.g., NNNN-NNNN (comma-separated for multiple)">
            </div>
            <div class="field-group">
              <label for="base_url">Base URL(s):</label>
              <input type="text" name="base_url" id="base_url" placeholder="Comma-separated URLs">
            </div>
            <div class="field-group">
              <label for="utm_content">UTM Content (optional):</label>
              <input type="text" name="utm_content" id="utm_content" placeholder="Optional UTM content">
            </div>
            <div class="field-group">
              <label for="filename">Output Filename (optional):</label>
              <input type="text" name="filename" id="filename" placeholder="Without .pdf/.indd extension">
            </div>
            <div class="field-group">
              <label for="underline">Underline Links?</label>
              <select name="underline" id="underline">
                <option value="false" selected>No</option>
                <option value="true">Yes</option>
              </select>
            </div>
            <div class="field-group">
              <label for="diagnostics">Diagnostics?</label>
              <select name="diagnostics" id="diagnostics">
                <option value="false" selected>No</option>
                <option value="true">Yes</option>
              </select>
            </div>
            <span class="utm-label" id="utm-label">UTM Parameters</span>
            <div class="utm-row" id="utm-row">
              <div class="field-group">
                <input type="text" name="source" id="utm_source" placeholder="Source">
              </div>
              <div class="field-group">
                <input type="text" name="medium" id="utm_medium" placeholder="Medium">
              </div>
              <div class="field-group">
                <input type="text" name="campaign" id="utm_campaign" placeholder="Campaign">
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" id="submitBtn" class="process-btn">Process Source File</button>
            </div>
          </form>
          <div id="status"></div>
          <div id="downloads"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="updated_src_script.js"></script>
</body>
</html>
