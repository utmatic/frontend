<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Utmatic Source File Processor</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    /* Inline for demonstration; put in styles.css for production */
    .side-by-side-fields {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .side-by-side-fields .field-group {
      flex: 1 1 200px;
      min-width: 200px;
    }
    @media (max-width: 700px) {
      .side-by-side-fields {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper" id="main-form-wrapper">
    <div class="main-group">
      <div class="header-container">
        <img alt="Utmatic Logo" class="logo" src="https://static1.squarespace.com/static/680bb671dac3025d584cb957/t/6821ece9779432159d432868/1747053801328/logo-utmatic-nobackground.png"/>
        <div class="header-text">
          <p>Process your InDesign source files with automatic hyperlinking and UTM tracking.</p>
        </div>
      </div>
      <div class="container">
        <div class="form-container">
          <form id="iddForm" enctype="multipart/form-data" autocomplete="off">
            <div class="field-group">
              <label for="file">Upload InDesign File (.indd):</label>
              <div class="custom-file-input-wrapper">
                <label class="custom-file-input-label" tabindex="0">
                  Choose File
                  <input type="file" name="file" id="file" accept=".indd" class="custom-file-input" required>
                </label>
                <span class="custom-file-filename" id="file-filename">No file chosen</span>
              </div>
            </div>
            <!-- Job Type Field -->
            <div class="field-group">
              <label for="job_type">Job Type:</label>
              <select name="job_type" id="job_type" required>
                <option value="add_utm">Add UTM</option>
                <option value="add_links_only">Add links only</option>
                <option value="add_links_with_utm">Add links with UTM</option>
              </select>
            </div>
            <!-- Target Format & Base URL side by side -->
            <div class="side-by-side-fields" id="link-fields" style="display:none;">
              <div class="field-group">
                <label for="target_formats">Target Format:</label>
                <input type="text" name="target_formats" id="target_formats" required placeholder="e.g. NNNN-NNNN, 1234-5678">
              </div>
              <div class="field-group">
                <label for="base_url">Base URL:</label>
                <input type="text" name="base_url" id="base_url" value="https://www.agilent.com/store/productDetail.jsp?catalogId=" required>
              </div>
            </div>
            <span class="utm-label" id="utm-label">UTM Parameters</span>
            <div class="utm-row" id="utm-row">
              <div class="field-group">
                <input type="text" name="utm_source" id="utm_source" placeholder="Source" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_medium" id="utm_medium" placeholder="Medium" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_campaign" id="utm_campaign" placeholder="Campaign" required>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" id="submitBtn" class="process-btn">Process Source File</button>
            </div>
          </form>
          <div id="status"></div>
          <div id="downloads"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- Loader/Spinner Overlay -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Processing...</div>
    <div class="loader-subtext">Thanks for your patience! Large documents may take a couple of minutes to process.</div>
  </div>
  <script src="src-script.js"></script>
  <script>
    // File input display
    document.getElementById('file').addEventListener('change', function() {
      const span = document.getElementById('file-filename');
      if (this.files && this.files.length > 0) {
        span.textContent = this.files[0].name;
      } else {
        span.textContent = "No file chosen";
      }
    });

    // Job type logic for showing/hiding fields
    function updateJobTypeFields() {
      const jobType = document.getElementById('job_type').value;
      const linkFields = document.getElementById('link-fields');
      const utmRow = document.getElementById('utm-row');
      const utmLabel = document.getElementById('utm-label');
      // Show/hide Target Format & Base URL
      if (jobType === "add_links_only" || jobType === "add_links_with_utm") {
        linkFields.style.display = "flex";
      } else {
        linkFields.style.display = "none";
      }
      // Show/hide UTM parameters
      if (jobType === "add_links_only") {
        utmRow.style.display = "none";
        utmLabel.style.display = "none";
        // Also remove required attribute from UTM fields
        document.getElementById('utm_source').required = false;
        document.getElementById('utm_medium').required = false;
        document.getElementById('utm_campaign').required = false;
      } else {
        utmRow.style.display = "";
        utmLabel.style.display = "";
        document.getElementById('utm_source').required = true;
        document.getElementById('utm_medium').required = true;
        document.getElementById('utm_campaign').required = true;
      }
    }
    document.getElementById('job_type').addEventListener('change', updateJobTypeFields);
    window.addEventListener('DOMContentLoaded', updateJobTypeFields);
  </script>
</body>
</html>
