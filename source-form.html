<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Utmatic Source File Processor</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      background: #fff;
    }
    .field-row-wrapper {
      margin-bottom: 1em;
    }
    .add-new-row-btn {
      background: none;
      border: none;
      color: #3653f8;
      font-size: 1em;
      font-family: inherit;
      font-weight: 500;
      margin-left: 0;
      margin-bottom: 0.6em;
      margin-top: 0;
      padding: 0;
      outline: none;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.13s;
      display: inline-block;
    }
    .add-new-row-btn:hover:not(:disabled) {
      text-decoration: underline;
      color: #2537b8;
    }
    .add-new-row-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      text-decoration: none;
    }
    .side-by-side-fields {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 0.5em;
    }
    .side-by-side-fields .field-group {
      flex: 1 1 200px;
      min-width: 200px;
    }
    .field-row {
      display: flex;
      gap: 16px;
      margin-bottom: 0.5em;
      align-items: center;
    }
    .delete-row-btn {
      background: none;
      border: none;
      color: #f43f5e;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0 0.3em;
      line-height: 1;
      transition: color 0.15s;
      margin-left: 8px;
      margin-right: 2px;
      display: flex;
      align-items: center;
    }
    .delete-row-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .side-by-side-fields input[type="text"] {
      border: 1px solid #d0d6e1;
      border-radius: 6px;
      padding: 0.5em 1em;
      font-size: 1em;
      font-family: inherit;
      background: #fff;
      color: #222;
      outline: none;
      margin-bottom: 0;
      width: 100%;
      box-sizing: border-box;
      transition: border 0.12s;
    }
    .side-by-side-fields input[type="text"]:focus {
      border-color: #3653f8;
    }
    .side-by-side-fields .field-group label {
      display: none;
    }
    @media (max-width: 700px) {
      .side-by-side-fields, .field-row {
        flex-direction: column;
        gap: 0;
      }
    }
    #loader {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.84);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.2s;
    }
    #loader.active {
      display: flex;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 7px solid #e4e7ef;
      border-top: 7px solid #3653f8;
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
      margin-bottom: 1em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      font-weight: 600;
      font-size: 1.2em;
      margin-bottom: 0.25em;
      color: #222;
      text-align: center;
    }
    .loader-subtext {
      color: #666;
      font-size: 1em;
      text-align: center;
    }
    #result-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 330px;
      margin-top: 4em;
    }
    #result-screen .result-heading {
      font-size: 1.25em;
      font-weight: 600;
      margin-bottom: 1.4em;
      color: #222;
      text-align: center;
    }
    #result-screen .result-btns {
      display: flex;
      flex-direction: row;
      gap: 1.5em;
      margin-bottom: 1.3em;
      flex-wrap: wrap;
      justify-content: center;
    }
    #result-screen .process-btn, #result-screen .startnew-btn {
      background: #3653f8;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.62em 2.2em;
      font-size: 1em;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      margin-top: 0.25em;
      transition: background 0.16s;
      box-shadow: 0 2px 9px 0 rgba(54,83,248,0.07);
    }
    #result-screen .process-btn:hover, #result-screen .startnew-btn:hover {
      background: #2537b8;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 0;
      padding: 2.5em 0;
      background: #fff;
    }
    .form-container {
      width: 100%;
      max-width: 540px;
      background: #fff;
      border-radius: 12px;
      padding: 2.6em 2.4em 2.1em 2.4em;
      margin: 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: min-height 0.18s, height 0.18s;
    }
    .utm-row,
    #link-fields {
      margin-bottom: 1.25em;
      transition: margin-bottom 0.14s;
    }
    .utm-row[style*="display: none"],
    #link-fields[style*="display: none"] {
      margin-bottom: 0 !important;
    }
    .form-actions {
      margin-top: 0.8em;
    }
    .form-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.1em;
      margin-top: 0;
    }
    .form-header img {
      width: 48px;
      height: 48px;
      margin-bottom: 0.55em;
      display: block;
    }
    .form-header-title {
      font-size: 1.45em;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.01em;
      text-align: center;
      margin-top: 0;
      margin-bottom: 0;
      line-height: 1.15;
      font-family: 'Work Sans', Arial, sans-serif;
    }
    #utm_content {
      background-color: #f9f9f9;
      cursor: not-allowed;
    }
    @media (max-width: 560px) {
      .form-container {
        padding: 1.7em 0.7em 1.3em 0.7em;
      }
      .form-header img {
        width: 40px;
        height: 40px;
      }
      .form-header-title {
        font-size: 1.1em;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper" id="main-form-wrapper">
    <div class="main-group">
      <div class="container">
        <div class="form-container">
          <form id="iddForm" enctype="multipart/form-data" autocomplete="off">
            <!-- Form Logo and Title -->
            <div class="form-header">
              <img src="https://images.squarespace-cdn.com/content/v1/680bb671dac3025d584cb957/635bc57a-38c1-43a1-8442-0c28b347d03d/favicon.ico?format=100w" alt="Utmatic Logo Icon" />
              <h1 class="form-header-title">Source File Processor</h1>
            </div>
            <div class="field-group">
              <label for="file">Upload File</label>
              <div class="custom-file-input-wrapper">
                <label class="custom-file-input-label" tabindex="0">
                  Choose File
                  <input type="file" name="file" id="file" accept=".indd" class="custom-file-input" required>
                </label>
                <span class="custom-file-filename" id="file-filename">No file chosen</span>
              </div>
            </div>
            <div class="field-group">
              <label for="job_type">Job Type:</label>
              <select name="job_type" id="job_type" required>
                <option value="" disabled selected>Select one</option>
                <option value="add_utm">Add UTM only</option>
                <option value="add_links_only">Add links only</option>
                <option value="add_links_with_utm">Add links with UTM</option>
              </select>
            </div>
            <div id="link-fields" class="field-row-wrapper" style="display:none;">
              <button type="button" class="add-new-row-btn" id="add-row-btn">+ Add new</button>
              <div id="target-base-rows"></div>
            </div>
            <span class="utm-label" id="utm-label">UTM Parameters</span>
            <div class="utm-row" id="utm-row">
              <div class="field-group">
                <input type="text" name="utm_source" id="utm_source" placeholder="Source" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_medium" id="utm_medium" placeholder="Medium" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_campaign" id="utm_campaign" placeholder="Campaign" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_content" id="utm_content" placeholder="Content (automatic)" readonly>
              </div>
            </div>
            <!-- Document Name field (required) -->
            <div class="field-group">
              <label for="document_name">Document Name (for output):</label>
              <input type="text" name="document_name" id="document_name" placeholder="e.g. Spring Sale Brochure" required>
            </div>
            <div class="form-actions">
              <button type="submit" id="submitBtn" class="process-btn" disabled>Process</button>
            </div>
          </form>
          <div id="status"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Processing your file...</div>
    <div class="loader-subtext">Thanks for your patience! Large documents may take a couple of minutes to process.</div>
  </div>
  <div id="result-screen">
    <div class="result-heading">Your processed files are ready!</div>
    <div class="result-btns" id="result-btns"></div>
    <button class="startnew-btn" id="start-new-btn">Start new submission</button>
  </div>
  <script src="src-script.js"></script>
</body>
</html>
