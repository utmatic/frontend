<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Utmatic Source File Processor</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="page-wrapper" id="main-form-wrapper">
    <div class="main-group">
      <div class="container">
        <div class="form-container">
          <form id="iddForm" enctype="multipart/form-data" autocomplete="off">
            <!-- Form Logo and Title -->
            <div class="form-header">
              <img src="https://images.squarespace-cdn.com/content/v1/680bb671dac3025d584cb957/635bc57a-38c1-43a1-8442-0c28b347d03d/favicon.ico?format=100w" alt="Utmatic Logo Icon" />
              <h1 class="form-header-title">Source File Processor</h1>
            </div>
            <div class="field-group">
              <label for="file">Upload File</label>
              <div class="custom-file-input-wrapper">
                <label class="custom-file-input-label" tabindex="0">
                  Choose File
                  <input type="file" name="file" id="file" accept=".indd" class="custom-file-input" required>
                </label>
                <span class="custom-file-filename" id="file-filename">No file chosen</span>
              </div>
            </div>
            <div class="field-group">
              <label for="job_type">Job Type:</label>
              <select name="job_type" id="job_type" required>
                <option value="" disabled selected>Select one</option>
                <option value="add_utm">Add UTM only</option>
                <option value="add_links_only">Add links only</option>
                <option value="add_links_with_utm">Add links with UTM</option>
              </select>
            </div>
            <div id="link-fields" class="field-row-wrapper" style="display:none;">
              <button type="button" class="add-new-row-btn" id="add-row-btn">+ Add new</button>
              <div id="target-base-rows"></div>
            </div>
            <span class="utm-label" id="utm-label">UTM Parameters</span>
            <div class="utm-row" id="utm-row">
              <div class="field-group">
                <input type="text" name="utm_source" id="utm_source" placeholder="Source" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_medium" id="utm_medium" placeholder="Medium" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_campaign" id="utm_campaign" placeholder="Campaign" required>
              </div>
              <div class="field-group">
                <input type="text" name="utm_content" id="utm_content" placeholder="Content (automatic)" readonly>
              </div>
            </div>
            <!-- Document Name field REMOVED -->
            <div class="form-actions">
              <button type="submit" id="submitBtn" class="process-btn" disabled>Process</button>
            </div>
          </form>
          <div id="status"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Processing your file...</div>
    <div class="loader-subtext">Thanks for your patience! Large documents may take a couple of minutes to process.</div>
  </div>
  <div id="result-screen">
    <div class="result-heading">Your processed files are ready!</div>
    <div class="result-btns" id="result-btns"></div>
    <button class="startnew-btn" id="start-new-btn">Start new submission</button>
  </div>
  <script src="src-script.js"></script>
</body>
</html>
