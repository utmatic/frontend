        <button class="auth-tab active" id="tab-signin" type="button">Sign in</button>
        <button class="auth-tab" id="tab-signup" type="button">Sign up</button>

      <form class="auth-form" id="signin-form" autocomplete="on">
        <div class="form-group">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" name="email" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" name="password" autocomplete="current-password" required/>
        </div>
        <div class="form-row align-center">
          <label class="checkbox-label">
            <input type="checkbox" name="remember"/>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="auth-btn">Sign in</button>
        <div id="signin-status" class="signup-status"></div>

        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="8"/>
        </div>
        <div class="form-group">

          <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" required minlength="8"/>
        </div>
